<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — LIFEVEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="Login.css" />
</head>
<body>
  <div class="caustics"></div>
  <div class="bubbles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="container">
    <header>
      <h1 class="logo">LIFEVEST</h1>
      <nav class="nav-buttons">
        <a class="nav-btn" href="index.html">Home</a>
        <a class="nav-btn" href="about.html">About</a>
        <a class="nav-btn active" href="contact.html">Contact</a>
        <a class="nav-btn" href="plans.html">Plans</a>
        <a class="nav-btn" href="Login.html">Sign Up / Log In</a>
      </nav>
    </header>

    <main>
      <section class="glass-card" style="max-width: 640px;">
        <div class="tag-box"><span class="tag">Get in touch</span></div>
        <h1>We're here to help.</h1>
        <p class="description" style="margin-bottom: 1.75rem;">
          Curious about our tools, need help using the app, or want to share feedback?
          Drop us a line and a member of our team will get back to you soon.
        </p>

        <form onsubmit="handleContact(event)">
          <div class="field">
            <label for="cName">Name</label>
            <input id="cName" name="name" type="text" placeholder="Your full name" required />
          </div>
          <div class="field">
            <label for="cEmail">Email</label>
            <input id="cEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="cMessage">Message</label>
            <input id="cMessage" name="message" type="text" placeholder="How can we help?" required />
          </div>
          <div id="contactFlash" class="flash"></div>
          <button type="submit" class="btn btn-primary btn-block">Send message</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    function handleContact(event) {
      event.preventDefault();
      const flash = document.getElementById('contactFlash');
      flash.className = 'flash success show';
      flash.textContent = "Thanks! We'll be in touch shortly.";
      event.target.reset();
    }
  </script>
</body>
</html>
