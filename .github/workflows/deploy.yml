# Push-to-deploy for the Veyra app.
#
# Vercel's native Git integration cannot be used here: the Vercel account
# (jwkw48qrxb-sketch) and the GitHub repo owner (Rico-cpu) are different
# accounts, so the Vercel GitHub App has no access to this repository. Driving
# the Vercel CLI from Actions with a deploy token works across that boundary.
#
# One-time setup: add a VERCEL_TOKEN repository secret.
#   token  → https://vercel.com/account/tokens
#   secret → repo Settings ▸ Secrets and variables ▸ Actions ▸ New secret
#
# main            → production deploy
# any other push  → preview deploy
# pull requests   → preview deploy
name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Identifiers, not credentials — deploying still requires VERCEL_TOKEN.
  VERCEL_ORG_ID: team_WOPUocq4CCQbz3krzWo42vxc
  VERCEL_PROJECT_ID: prj_quzjkLYvPJlxkQIVoSHNFlxlcgok

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The decision core guards money movement. It gates the deploy.
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    # Without the token the job cannot do anything useful, so skip it cleanly
    # rather than failing every push until the secret exists.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for deploy token
        id: guard
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Explain missing token
        if: steps.guard.outputs.ready != 'true'
        run: |
          echo "::warning::VERCEL_TOKEN is not set — skipping deploy."
          echo "Add it at Settings ▸ Secrets and variables ▸ Actions."

      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Resolve target
        if: steps.guard.outputs.ready == 'true'
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.guard.outputs.ready == 'true'
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed (${{ steps.target.outputs.env }})"
            echo ""
            echo "- App: ${{ steps.deploy.outputs.url }}/veyra"
            echo "- Root: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
